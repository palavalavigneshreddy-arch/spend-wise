{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}SpendWise{% endblock %}</title><link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet"><link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}"><link rel="stylesheet" href="{% static 'tracker/css/app.css' %}"></head><body><div class="app-shell"><aside class="sidebar"><a class="brand" href="{% url 'dashboard' %}"><i class="bi bi-wallet2"></i>SpendWise</a><nav><a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}"><i class="bi bi-grid-1x2"></i>Dashboard</a><a class="nav-link {% if request.resolver_match.url_name == 'expenses' %}active{% endif %}" href="{% url 'expenses' %}"><i class="bi bi-receipt"></i>Expenses</a><a class="nav-link {% if request.resolver_match.url_name == 'categories' %}active{% endif %}" href="{% url 'categories' %}"><i class="bi bi-tags"></i>Categories</a><a class="nav-link {% if request.resolver_match.url_name == 'budgets' %}active{% endif %}" href="{% url 'budgets' %}"><i class="bi bi-pie-chart"></i>Monthly Budgets</a></nav><div class="mt-auto position-absolute bottom-0 start-0 end-0 p-3"><div class="small text-white-50 mb-2 px-2">Signed in as {{ request.user.username }}</div><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="nav-link border-0 bg-transparent w-100 text-start"><i class="bi bi-box-arrow-left"></i>Log out</button></form></div></aside><main class="main"><button class="mobile-toggle mb-3" data-sidebar-toggle><i class="bi bi-list"></i></button>{% if messages %}{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main></div><script src="{% static 'tracker/js/app.js' %}"></script></body></html>
