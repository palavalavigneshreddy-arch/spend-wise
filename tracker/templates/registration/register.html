{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · SpendWise</title><link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet"><link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}"><link rel="stylesheet" href="{% static 'tracker/css/app.css' %}"></head><body><main class="auth-page"><div class="card auth-card"><a class="brand" href="{% url 'login' %}"><i class="bi bi-wallet2"></i>SpendWise</a><h1>Create your account</h1><p class="subtitle">Start building better money habits today.</p><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-teal w-100 mt-2">Create account</button></form><p class="text-center text-muted mt-4 mb-0">Already have an account? <a class="link-teal" href="{% url 'login' %}">Sign in</a></p></div></main></body></html>
