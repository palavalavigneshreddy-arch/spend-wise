services:
  - type: web
    name: spendwise
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: spendwise-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"

databases:
  - name: spendwise-db
    databaseName: spendwise
    user: spendwise
